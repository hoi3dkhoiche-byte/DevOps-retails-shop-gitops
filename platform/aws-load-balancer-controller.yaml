nodeSelector:
  workload: management
tolerations:
- key: workload
  operator: Equal
  value: management
  effect: NoSchedule
clusterName: retail-lab-eks
region: ap-southeast-1
enableBackendSecurityGroup: true
replicaCount: 1
serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations: {}
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

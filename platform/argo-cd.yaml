global:
  nodeSelector:
    workload: management
  tolerations:
  - key: workload
    operator: Equal
    value: management
    effect: NoSchedule
controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
server:
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
redis-ha:
  enabled: false
configs:
  cm:
    resource.customizations.health.argoproj.io_Application: |
      hs = {status = "Progressing", message = "Waiting for child Application to sync"}
      if obj.status ~= nil and obj.status.sync ~= nil and obj.status.sync.status == "Synced" and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message
      end
      return hs
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = {status = "Progressing", message = "Waiting for Secrets Manager synchronization"}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" and condition.status == "True" then hs.status = "Healthy" end
        end
      end
      return hs
  params:
    server.insecure: false
  secret:
    createSecret: false
redisSecretInit:
  enabled: false
redis:
  existingSecret: argocd-redis
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  copyutil:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
dex:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  initImage:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
notifications:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

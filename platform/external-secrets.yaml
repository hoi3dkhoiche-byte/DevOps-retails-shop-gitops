nodeSelector:
  workload: management
tolerations:
- key: workload
  operator: Equal
  value: management
  effect: NoSchedule
installCRDs: true
webhook:
  nodeSelector:
    workload: management
  tolerations:
  - key: workload
    operator: Equal
    value: management
    effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
certController:
  nodeSelector:
    workload: management
  tolerations:
  - key: workload
    operator: Equal
    value: management
    effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector:
  workload: management
tolerations:
- key: workload
  operator: Equal
  value: management
  effect: NoSchedule
cloudProvider: aws
awsRegion: ap-southeast-1
autoDiscovery:
  clusterName: retail-lab-eks
image:
  tag: v1.36.1
rbac:
  serviceAccount:
    create: true
    name: cluster-autoscaler
    annotations: {}
extraArgs:
  balance-similar-node-groups: false
  skip-nodes-with-system-pods: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

prometheus:
  prometheusSpec:
    nodeSelector:
      workload: management
    tolerations:
    - key: workload
      operator: Equal
      value: management
      effect: NoSchedule
    replicas: 1
    retention: 7d
    retentionSize: 24GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 30Gi
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
grafana:
  nodeSelector:
    workload: management
  tolerations:
  - key: workload
    operator: Equal
    value: management
    effect: NoSchedule
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClassName: gp3-retain
    size: 5Gi
  admin:
    existingSecret: grafana-admin
    userKey: username
    passwordKey: password
  additionalDataSources:
  - name: Loki
    type: loki
    url: http://loki:3100
    access: proxy
    uid: loki
  - name: CloudWatch
    type: cloudwatch
    jsonData:
      authType: default
      defaultRegion: ap-southeast-1
    uid: cloudwatch
  serviceAccount:
    create: true
    name: grafana
    annotations: {}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: monitoring
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  initChownData:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  downloadDashboards:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
alertmanager:
  alertmanagerSpec:
    nodeSelector:
      workload: management
    tolerations:
    - key: workload
      operator: Equal
      value: management
      effect: NoSchedule
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
prometheusOperator:
  nodeSelector:
    workload: management
  tolerations:
  - key: workload
    operator: Equal
    value: management
    effect: NoSchedule
  admissionWebhooks:
    patch:
      nodeSelector:
        workload: management
      tolerations:
      - key: workload
        operator: Equal
        value: management
        effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
kube-state-metrics:
  nodeSelector:
    workload: management
  tolerations:
  - key: workload
    operator: Equal
    value: management
    effect: NoSchedule
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
prometheus-node-exporter:
  tolerations:
  - operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
crds:
  upgradeJob:
    nodeSelector:
      workload: management
    tolerations:
    - key: workload
      operator: Equal
      value: management
      effect: NoSchedule
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

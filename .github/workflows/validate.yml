name: GitOps validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        timeout-minutes: 3
        run: python -m pip install --require-hashes --requirement requirements-gitops.txt
      - name: Check immutable release inputs
        id: release
        run: python scripts/check-release.py
      - name: Checkout the charts tested by this release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hoi3dkhoiche-byte/DevOps-retails-shop
          ref: ${{ steps.release.outputs.source_commit }}
          path: .local/source
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Install pinned Helm
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          working_directory: .
          install_args: helm
          cache: "false"
      - name: Checkout the charts tested by the production release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hoi3dkhoiche-byte/DevOps-retails-shop
          ref: ${{ steps.release.outputs.prod_source_commit }}
          path: .local/production-source
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Test release, acceptance and activation contracts
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p .local/reports
          python -B scripts/test-contracts.py release --report .local/reports/release-tests.json 2>&1 | tee .local/reports/release-tests.log
          python -B scripts/test-contracts.py graph --report .local/reports/graph-tests.json 2>&1 | tee .local/reports/graph-tests.log
      - name: Validate activation guard and render application graphs
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python validate.py --source .local/source/retail-store-sample-app --prod-source .local/production-source/retail-store-sample-app 2>&1 | tee .local/reports/application-graph.log
      - name: Render pinned platform charts and enforce both management node budgets
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python scripts/check-platforms.py --download --cache .local/platform-charts --report .local/reports/platform-budget.json 2>&1 | tee .local/reports/platform-budget.log
      - name: Retain validation reports and logs
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitops-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  gitops-required:
    name: gitops-required
    if: always()
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complete validation gate to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          printf 'GitOps validation result: %s\n' "$VALIDATION_RESULT"
          test "$VALIDATION_RESULT" = success

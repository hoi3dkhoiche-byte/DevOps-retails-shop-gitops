name: GitOps validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-gitops.txt
      - name: Check immutable release inputs
        id: release
        run: python scripts/check-release.py
      - name: Checkout the charts tested by this release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hoi3dkhoiche-byte/DevOps-retails-shop
          ref: ${{ steps.release.outputs.source_commit }}
          path: .local/source
          persist-credentials: false
      - name: Install pinned Helm
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          working_directory: .
          install_args: helm
          cache: "false"
      - name: Checkout the charts tested by the production release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hoi3dkhoiche-byte/DevOps-retails-shop
          ref: ${{ steps.release.outputs.prod_source_commit }}
          path: .local/production-source
          persist-credentials: false
      - name: Test release, acceptance and activation contracts
        run: |
          python -B -m unittest discover -s scripts/release -p 'test_*.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate activation guard and render application graphs
        run: python validate.py --source .local/source/retail-store-sample-app --prod-source .local/production-source/retail-store-sample-app

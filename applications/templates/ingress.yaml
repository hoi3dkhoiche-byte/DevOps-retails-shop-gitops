{{- if include "retail.deploymentEnabled" . }}
{{- if .Values.release.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-ui
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    {{- if .Values.domain }}
    alb.ingress.kubernetes.io/group.name: retail-public
    {{- else }}
    # Hostless dev/prod '/' rules need separate ALBs to avoid routing collisions.
    alb.ingress.kubernetes.io/group.name: {{ printf "retail-%s" .Values.environment | quote }}
    {{- end }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/success-codes: "200"
    {{- if .Values.domain }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ required "Domain ingress requires a validated ACM certificate" .Values.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- if eq .Values.environment "dev" }}
    alb.ingress.kubernetes.io/conditions.ui-active: {{ list (dict "field" "source-ip" "sourceIpConfig" (dict "values" .Values.adminCidrs)) | toJson | quote }}
    {{- end }}
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/inbound-cidrs: {{ join "," .Values.adminCidrs | quote }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - {{ if .Values.domain }}host: {{ printf "%sretail.%s" (ternary "dev." "" (eq .Values.environment "dev")) .Values.domain | quote }}{{ end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui-active
                port: {number: 8080}
{{- end }}
{{- end }}

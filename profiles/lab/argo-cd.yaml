# One small management node; local admin login is supplied by ESO.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  # Pinned chart always renders this Deployment; replicas=0 stops its controller.
  replicas: 0
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
server:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
redis:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}
